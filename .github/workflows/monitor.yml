name: Monitor Alpaca Paper Trading

on:
  schedule:
    # Cada 15 minuts. Nota: GitHub pot retardar-se uns minuts en hores punta,
    # és normal i no té impacte real en una estratègia de marges del 5-10%.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # Permet llançar-ho manualment des de la pestanya "Actions" de GitHub,
    # útil per provar-ho sense esperar els 15 minuts.

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instal·lar dependències
        run: pip install -r requirements.txt

      - name: Revisar senyals de compra (RSI)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 auto_trader.py

      - name: Executar la comprovació de vendes (SL/TP)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 monitor_once.py
name: Executar Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar codi
        uses: actions/checkout@v3

      - name: Configurar Python (o la teva plataforma)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Executar el bot
        run: python main.py

      # AQUEST ÉS EL PAS DE TELEGRAM QUE HAS D'AFEGIR AL FINAL:
      - name: Notificar per Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🤖 **Trading Bot Executat!**
            El bot s'ha executat amb èxit.
